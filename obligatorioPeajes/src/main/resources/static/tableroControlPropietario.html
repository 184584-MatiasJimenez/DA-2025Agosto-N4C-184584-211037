<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Control</title>
    <!-- Enlace al CSS externo -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- Scripts -->
    <script src="vistaWeb.js"></script>
    <script src="sse.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <script src="utilesVista.js"></script>

    <div id="main-app-container">
        <div id="dashboard-view" style="display:block;" class="p-6">
            <div class="header-dashboard">
                <h1 class="text-3xl font-extrabold text-gray-800 mb-4 md:mb-0">
                    Tablero de Control del Propietario
                </h1>
                <button onclick="logoutPropietario();" class="btn-logout">
                    Cerrar Sesión
                </button>
            </div>

            <!-- Tarjetas -->
            <div class="data-cards">
                <div class="card card-blue">
                    <h2>Propietario</h2>
                    <div id="nombre-completo-value" class="value">
                        <label id="nombreCompleto"></label>
                    </div>
                </div>
                <div class="card card-green">
                    <h2>Estado de la Cuenta</h2>
                    <div id="estado-value" class="value">Activo</div>
                </div>
                <div class="card card-yellow">
                    <h2>Saldo Disponible</h2>
                    <div id="saldo-value" class="value">$ 0.00</div>
                </div>
            </div>

            <!-- Tabla -->
            <h2>Vehículos Registrados</h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Matrícula</th>
                            <th>Modelo</th>
                            <th>Color</th>
                            <th>Tránsitos</th> <th>Monto Total</th> </tr>
                    </thead>
                    <tbody id="vehiculos-body">
                        <tr>
                            <td colspan="3" class="text-center">Cargando vehículos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="mensajeDlg">
        <div class="modal-content">
            <h3 class="text-xl font-semibold text-primary">Mensaje del Sistema</h3>
            <p id="textoMensaje" class="my-4"></p>
            <button id="botonAceptar">Aceptar</button>
        </div>
    </div>
</body>
</html>
    <script>
        urlIniciarVista = "/menuTablero/vistaConectada";
        urlCierreVista = "/acceso/logout";
        urlRegistroSSE = "/menuTablero/registrarSSE"; // Al cargarse el menu tablero se registra el SSE
        const spnNombreCompleto = document.getElementById("nombreCompleto");
        console.log("Iniciando Tablero Control Propietario", spnNombreCompleto);

        function cargarContenido(pagina) {
            document.getElementById('contenidoFrame').src = pagina;
        }

        function logoutPropietario() {
            submit("/acceso/logout", null);
        }

        function mostrar_usuarioNoAutenticado(urlDestino) {
            window.location.href = urlDestino;
        }

        function mostrar_nombreCompleto(nombreCompleto) {
            spnNombreCompleto.innerHTML = "TABLERO DE " + nombreCompleto.toUpperCase();
        }

        //Procesa los mensajes recibidos por SSE
        function procesarMensajeSSE(mensaje) {

            var iframe = document.getElementById('contenidoFrame');
            var iframeWindow = iframe.contentWindow;
            iframeWindow.procesarResultadosSubmit(mensaje); //asumo que el iFrame tiene vistaWeb.js incluida
        }

        //Se ejecuta cuando se cierra la conexion desde el servidor
        //Si no se define esta funcion, por defecto se "borra" la pagina 
        function conexionSSECerrada(event) {
            cerrar();
        }
        async function cerrar() {
            let respuesta = await mostrarConfirmacion("Se ha cerrado la aplicacion en esta ventana", "Intenar volver a abrirla", "Cerrar");
            if (respuesta) {
                location.reload();
            } else {
                document.body.innerHTML = '';
            }
        }

        function cargarVehiculos() {
            submit("/menuTablero/vehiculosPropietario", null, 'GET');
        }

        const configuracionColumnasVehiculos = [
            { campo: 'matricula' },
            { campo: 'modelo'},
            { campo: 'color' },
            { campo: 'cantidadTransitos' },
            { campo: 'montoTotalGastado', formateador: monto => '$ ' + monto.toFixed(2) }
        ];
        
        function mostrar_listaVehiculos(vehiculos){
            const tbody = document.getElementById('vehiculos-body');
            tbody.innerHTML = crearFilasTablaDesdeJson({
                data : vehiculos,
                columnas: configuracionColumnasVehiculos
            });
        }
        function primerSubmitFinalizado() {
            cargarVehiculos();
        }
        
    </script>
