<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obligatorio Peajes</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos esenciales y para el modal */
        :root {
            --color-primary: #007bff;
            --color-secondary: #0056b3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
        }

        #main-app-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        #login-view {
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-ingresar {
            width: 100%;
            padding: 12px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn-ingresar:hover {
            background-color: var(--color-secondary);
        }

        /* Modal Styles */
        #mensajeDlg {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #mensajeDlg .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        #botonAceptar {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #botonAceptar:hover {
            background-color: var(--color-secondary);
        }
    </style>
</head>

<body>
    <title>Sistema de Peaejes - Menú Principal</title>
    <link rel="stylesheet" href="./css/estilos.css">
    </head>

    <body>
        <div class="container">
            <h1>Sistema de Gestión de Peajes</h1>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">
                Seleccione una opción del menú
            </p>

            <div class="menu-container">
                <div class="menu-item">
                    <h3>Herramientas del usuario de Propietario</h3>
                    <p>Acceder a las herramientas del usuario propietario</p>
                    <button onclick="window.location.href='login.html?rol=PROPIETARIO'" class="menu-button">
                        Login de Usuario Propietario
                    </button>
                </div>

                <div class="menu-item">
                    <h3>Herramientas del administrador</h3>
                    <p>Acceder a las herramientas del administrador del sistema</p>
                    <button onclick="window.location.href='login.html?rol=ADMINISTRADOR'" class="menu-button">
                        Login de usuario Administrador
                    </button>
                </div>


            </div>
        </div>

        <style>
            .menu-container {
                display: flex;
                flex-direction: column;
                gap: 20px;
                margin-top: 20px;
            }

            .menu-item {
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
                background-color: #f9f9f9;
                transition: all 0.3s ease;
            }

            .menu-item:hover:not([style*="opacity"]) {
                background-color: #f0f0f0;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            .menu-item h3 {
                margin: 0 0 10px 0;
                color: #333;
                font-size: 1.2rem;
            }

            .menu-item p {
                margin: 0 0 15px 0;
                color: #666;
                line-height: 1.4;
            }

            .menu-button {
                width: 100%;
                padding: 12px 20px;
                font-size: 1rem;
                border-radius: 6px;
                border: none;
                background-color: #0057b8;
                color: white;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

            .menu-button:hover:not(:disabled) {
                background-color: #004799;
            }

            .menu-button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
        </style>
    </body>

</html>
