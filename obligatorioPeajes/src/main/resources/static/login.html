<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso a la aplicación</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/modal.css">
    <script src="vistaWeb.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <script src="utilesVista.js"></script>
    <div id="main-app-container">
        <div id="login-view">
            <div class="login-card">
                <div class="header-section">
                    <div class="app-icon"></div>
                    <h1>Ingreso a la aplicación</h1>
                </div>
                <p class="subtitle">Por favor ingrese con su cédula de identidad y contraseña.</p>
                <p id="rolTexto" style="margin-top:8px;color:#333;font-weight:600;"></p>

                <form id="loginForm" onsubmit="acceder(event);">
                    <div class="form-group">
                        <label for="cedula">Cédula de identidad</label>
                        <input type="text" id="cedula" name="cedula" placeholder="Ej: 41234567" required>
                        <p class="hint-text">Solo números, sin puntos ni guiones.</p>
                    </div>

                    <div class="form-group">
                        <label for="contrasenia">Contraseña</label>
                        <input type="password" id="contrasenia" name="contrasenia" placeholder="Ingrese su contraseña"
                            required>
                    </div>

                    <input type="hidden" id="rol" name="rol" value="propietario">
                    <button type="submit" class="btn-ingresar">Ingresar</button>
                </form>

                <p id="footerText" class="footer-text">© 2025 - Acceso de </p>
            </div>
        </div>

        <div id="cu-views" style="display:none;">
        </div>
    </div>

    <!-- Modal de Mensajes (reemplaza a alert/confirm) -->
    <div id="mensajeDlg">
        <div class="modal-content">
            <h3 class="text-xl font-semibold text-primary">Mensaje del Sistema</h3>
            <p id="textoMensaje" class="my-4"></p>
            <button id="botonAceptar">Aceptar</button>
        </div>
    </div>

    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                const rol = params.get('rol');

                // Si no viene el parámetro 'rol' en la URL, redirigir a index.html
                if (!rol) {
                    window.location.href = 'index.html';
                    return;
                }

                // Si existe, colocarlo en el campo oculto y en el texto visible
                const rolInput = document.getElementById('rol');
                if (rolInput) rolInput.value = rol;

                const rolTexto = document.getElementById('rolTexto');
                if (rolTexto) {
                    const textoFormateado = rol.charAt(0).toUpperCase() + rol.slice(1).toLowerCase();
                    const footer = document.getElementById("footerText");

                    if (textoFormateado === "Propietario") {
                        footer.textContent += "propietarios";
                    } else if (textoFormateado === "Administrador") {
                        footer.textContent += "administradores";
                    } else {
                        footer.textContent += "usuario";
                    }
                }
            } catch (e) {
                console.warn('No se pudo leer el rol desde la URL:', e);
            }
        })();

        // --- MANEJO DE SESIÓN ---
        function acceder(event) {
            event.preventDefault();
            const rol = document.getElementById('rol').value;
            submit(`acceso${rol.charAt(0).toUpperCase() + rol.slice(1).toLowerCase()}/login`, serializarFormulario("loginForm"));
        }

        async function mostrar_error(mensaje) {
            await mostrarMensaje(mensaje);
        }

        function mostrar_Login_exitoso(urlDestino) {
            window.location.href = urlDestino;
        }

        async function mostrar_Credenciales_incorrectas() {
            await mostrarMensaje("Cédula o contraseña incorrectas. Por favor, intente nuevamente.");
        }

        async function excepcionDeAplicacion(text) {
            await mostrarMensaje(text);
        }
    </script>
</body>


</html>
